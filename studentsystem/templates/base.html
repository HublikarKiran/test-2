<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student System{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #0f766e;
            color: white;
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 16px;
            font-weight: bold;
        }

        main {
            max-width: 1000px;
            margin: 32px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            background: #0f766e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            border: 0;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            background: white;
        }

        th,
        td {
            border: 1px solid #dbe3ef;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #e8f3f1;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 6px 0 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .messages {
            color: #b91c1c;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>
    <header>
        <strong>Student System</strong>
        <nav>
            <a href="{% url 'landing' %}">Home</a>
            {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'logout' %}">Logout</a>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            {% endif %}
            <a href="/django-admin/">Django Admin</a>
        </nav>
    </header>
    <main>
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}



        {% block content %}


        {% endblock %}
    </main>
</body>

</html>
